    <circle cx="586" cy="205" r="6"/><circle cx="667" cy="414" r="5"/>
    <circle cx="505" cy="497" r="6"/><circle cx="221" cy="460" r="5"/>
    <circle cx="378" cy="335" r="7"/>
  </g>
  <path d="M155 207 344 130 586 205 667 414 505 497 378 335 221 460" fill="none" stroke="#e5b5ff" stroke-opacity=".35" stroke-width="2"/>
  <text x="400" y="676" fill="#fff" text-anchor="middle" font-family="Georgia,serif" font-size="69">Sete Estrelas</text>
  <text x="400" y="722" fill="#e4c7ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" letter-spacing="6">ARTE PROVISÓRIA</text>
