  <defs>
    <radialGradient id="ceu"><stop stop-color="#6635b1"/><stop offset=".55" stop-color="#291059"/><stop offset="1" stop-color="#10072d"/></radialGradient>
    <radialGradient id="brilho"><stop stop-color="#fff"/><stop offset=".13" stop-color="#f2c9ff"/><stop offset="1" stop-color="#b76cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#ceu)"/>
  <g fill="url(#brilho)">
    <circle cx="155" cy="207" r="57"/><circle cx="344" cy="130" r="52"/>
    <circle cx="586" cy="205" r="62"/><circle cx="667" cy="414" r="54"/>
    <circle cx="505" cy="497" r="59"/><circle cx="221" cy="460" r="53"/>
    <circle cx="378" cy="335" r="65"/>
  </g>
  <g fill="#fff">
